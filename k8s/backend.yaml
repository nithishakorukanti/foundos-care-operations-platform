apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundos-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: foundos-backend
  template:
    metadata:
      labels:
        app: foundos-backend
    spec:
      containers:
        - name: backend
          image: foundos-backend:latest
          ports:
            - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: foundos-backend
spec:
  selector:
    app: foundos-backend
  ports:
    - port: 4000
      targetPort: 4000
