apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundos-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: foundos-frontend
  template:
    metadata:
      labels:
        app: foundos-frontend
    spec:
      containers:
        - name: frontend
          image: foundos-frontend:latest
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: foundos-frontend
spec:
  selector:
    app: foundos-frontend
  ports:
    - port: 5173
      targetPort: 5173
